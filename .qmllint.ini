# qmllint configuration for the GitNaga QML module.
#
# The graph item is a C++ QML type whose prototype is QQuickPaintedItem. That
# prototype is not part of the QML type set the linter resolves, so every file
# that instantiates the item reports a cascade of tooling-only findings.
# UnresolvedType, MissingType, and ImportFailure are disabled for that reason.
#
# UnqualifiedAccess is disabled deliberately: the interface reads
# component-scope members (repository, colors) and delegate-outer ids without an
# id prefix. Migrating to `pragma ComponentBehavior: Bound` with fully qualified
# access is tracked as a follow-up and must be one coherent change.
#
# MaxWarnings=0 makes the lint gate fail on any remaining warning.
[General]
MaxWarnings=0

[Warnings]
UnresolvedType=disable
MissingType=disable
ImportFailure=disable
UnqualifiedAccess=disable
