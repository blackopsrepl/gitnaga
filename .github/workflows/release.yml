name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: verify tag, build, publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches the version surface
        run: |
          version=$(sed -n 's/^set(GITNAGA_VERSION "\([^"]*\)")/\1/p' cmake/GitNagaVersion.cmake)
          test -n "$version" || { echo "cannot read GITNAGA_VERSION"; exit 1; }
          test "v$version" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match version surface v$version"
            exit 1
          }

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install Qt 6.9.1
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.9.1"
          cache: true

      - name: Install Ninja and ccache
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Build and test the release
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release --output-on-failure

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
